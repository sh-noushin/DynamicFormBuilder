# Release workflow — triggered by pushing a git tag matching v* (e.g.
# v1.0.0). Builds the API and web Docker images with the tag as their
# version and pushes them to GitHub Container Registry.
#
# To cut a release once this workflow is on main:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Images will land at:
#   ghcr.io/<owner>/formbuilder-api:v1.0.0
#   ghcr.io/<owner>/formbuilder-api:latest
#   ghcr.io/<owner>/formbuilder-web:v1.0.0
#   ghcr.io/<owner>/formbuilder-web:latest
#
# The workflow uses the built-in GITHUB_TOKEN so no extra secrets are
# needed. Swap the REGISTRY / IMAGE_PREFIX env vars if you'd rather
# publish to Docker Hub or a private registry.

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/formbuilder

jobs:
  images:
    name: Build + push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag ref looks like refs/tags/v1.0.0; strip the prefix for a
      # clean semver-shaped image tag.
      - name: Compute version tag
        id: version
        run: echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/FormBuilder.API/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build + push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  release-notes:
    name: Create GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Reuses CHANGELOG.md as the release body. The `--notes-from-tag`
      # trick would pull just the section under this tag's heading, but
      # gh doesn't parse markdown so we upload the whole file - readers
      # scroll to the right section.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes-file CHANGELOG.md \
            --verify-tag
