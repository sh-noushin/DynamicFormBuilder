# nginx serves the built Angular SPA and proxies API traffic to the api
# service on the shared docker-compose network. The critical rule is
# `try_files ... /index.html` so /f/<slug> and /admin/... can be
# refreshed without hitting a 404.

server {
    listen 80;
    server_name _;

    # Uploaded files (signature blobs, attachments) can be sizeable; keep
    # this in sync with FileUploads:MaxFileSizeBytes on the API.
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't an existing file gets index.html
    # so Angular router owns the URL space.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable Angular hash-named bundles hard. index.html itself
    # must never be cached or the SPA silently keeps serving stale JS.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API + uploads round-trip. `api` is the docker-compose service name.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
