<h2 mat-dialog-title class="dialog-title">
  <mat-icon>code</mat-icon>
  <span>Embed &ldquo;{{ data.formName }}&rdquo;</span>
  <span class="spacer"></span>
</h2>

<mat-dialog-content class="dialog-content">
  <div class="size-row">
    <div class="width-group">
      <label>Width</label>
      <mat-button-toggle-group [value]="widthMode()" (change)="setWidthMode($any($event).value)">
        <mat-button-toggle value="full">Full width</mat-button-toggle>
        <mat-button-toggle value="fixed">Fixed</mat-button-toggle>
      </mat-button-toggle-group>
      @if (widthMode() === 'fixed') {
        <mat-form-field appearance="outline" class="size-field">
          <mat-label>Width (px)</mat-label>
          <input matInput type="number" min="200" max="1600" step="10"
                 [value]="widthPx()"
                 (input)="setWidthPx($any($event.target).value)" />
        </mat-form-field>
      }
    </div>

    <mat-form-field appearance="outline" class="size-field">
      <mat-label>Height (px)</mat-label>
      <input matInput type="number" min="200" max="4000" step="10"
             [value]="heightPx()"
             (input)="setHeightPx($any($event.target).value)" />
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full-width snippet-field">
    <mat-label>Copy-paste this HTML</mat-label>
    <textarea matInput rows="3" readonly [value]="snippet()"></textarea>
    <button mat-icon-button matSuffix type="button" (click)="copySnippet()" aria-label="Copy embed code">
      <mat-icon>content_copy</mat-icon>
    </button>
  </mat-form-field>

  <div class="preview-shell">
    <div class="preview-frame"
         [style.width]="previewWidth()"
         [style.height.px]="previewHeight()">
      <iframe [src]="safeUrl"
              [attr.width]="widthAttr()"
              [attr.height]="previewHeight()"
              title="Embed preview"
              style="border:0;width:100%;height:100%;"></iframe>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-raised-button type="button" (click)="close()">Close</button>
  <button mat-raised-button color="primary" type="button" (click)="copySnippet()">
    <mat-icon>content_copy</mat-icon>
    <span>Copy code</span>
  </button>
</mat-dialog-actions>
