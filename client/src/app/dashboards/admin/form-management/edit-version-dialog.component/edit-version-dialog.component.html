<h2 mat-dialog-title class="dialog-title">
  <mat-icon>edit</mat-icon>
  <span>Edit Version</span>
  <span class="spacer"></span>
</h2>

<mat-dialog-content class="dialog-content">
  <div class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput [value]="description()" (input)="setDescriptionFromEvent($event)" rows="3" placeholder="Description"></textarea>
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <div class="left-actions">
    <button mat-raised-button color="primary" class="btn-primary" type="button" (click)="openAddFieldDialog()">
      <mat-icon>add</mat-icon>
      <span>Add Form Field</span>
    </button>
  </div>
  <span class="spacer"></span>
  <div class="right-actions">
    <button mat-raised-button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" class="btn-primary" type="button" (click)="submit()">
      <mat-icon>save</mat-icon>
      Save
    </button>
  </div>
</mat-dialog-actions>
