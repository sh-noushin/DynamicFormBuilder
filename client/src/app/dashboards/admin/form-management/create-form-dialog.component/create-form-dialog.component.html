<h2 mat-dialog-title class="dialog-title">
  <mat-icon>post_add</mat-icon>
  <span>Create New Form</span>
  <span class="spacer"></span>
</h2>

<mat-dialog-content class="dialog-content">
  <div class="dialog-form" id="create-form-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Form name</mat-label>
      <input matInput [value]="name()" (input)="setNameFromEvent($event); touched.name.set(true)" placeholder="Form name" autofocus />
      @if (nameError()) { <mat-error>{{ nameError() }}</mat-error> }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput [value]="description()" (input)="setDescriptionFromEvent($event); touched.description.set(true)" placeholder="Description" rows="3"></textarea>
    </mat-form-field>

    <div class="brand-row">
      <label class="brand-label">
        <mat-icon>palette</mat-icon>
        <span>Brand color</span>
      </label>
      <input type="color" class="brand-input" [value]="brandColor() || '#6366f1'" (input)="brandColor.set($any($event.target).value)" />
      <span class="brand-hex" [style.color]="brandColor() || '#94a3b8'">{{ brandColor() || 'Default' }}</span>
      @if (brandColor()) {
        <button mat-button type="button" class="brand-reset" (click)="clearBrandColor()">
          <mat-icon>refresh</mat-icon>
          <span>Reset</span>
        </button>
      }
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Access password (optional)</mat-label>
      <input matInput
             [type]="showPassword() ? 'text' : 'password'"
             [value]="accessPassword()"
             (input)="setAccessPasswordFromEvent($event)"
             placeholder="Leave blank for public access"
             autocomplete="new-password" />
      <button mat-icon-button matSuffix type="button"
              (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
        <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      @if (accessPassword()) {
        <button mat-icon-button matSuffix type="button" (click)="clearAccessPassword()" aria-label="Clear password">
          <mat-icon>close</mat-icon>
        </button>
      }
      <mat-hint>When set, visitors must enter this password to view and submit the form.</mat-hint>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-raised-button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" type="button" class="btn-primary" (click)="submit()" [disabled]="invalid || isSubmitting()">
    @if (!isSubmitting()) { <mat-icon>save</mat-icon> } @else { <mat-icon>hourglass_top</mat-icon> }
    @if (!isSubmitting()) { <span>Save</span> } @else { <span>Saving...</span> }
  </button>
</mat-dialog-actions>
