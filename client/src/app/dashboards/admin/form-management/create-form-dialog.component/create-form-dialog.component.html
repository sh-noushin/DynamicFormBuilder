<h2 mat-dialog-title class="dialog-title">
  <mat-icon>post_add</mat-icon>
  <span>Create new form</span>
  <span class="spacer"></span>
</h2>

<mat-dialog-content class="dialog-content">
  <p class="dialog-subtitle">
    Just the basics to get started &mdash; you can configure password
    protection, webhooks, limits, and confirmation emails after the form
    is created.
  </p>

  <div class="dialog-form" id="create-form-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Form name</mat-label>
      <input matInput [value]="name()" (input)="setNameFromEvent($event); touched.name.set(true)" placeholder="e.g. Customer feedback" autofocus />
      @if (nameError()) { <mat-error>{{ nameError() }}</mat-error> }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description (optional)</mat-label>
      <textarea matInput [value]="description()" (input)="setDescriptionFromEvent($event); touched.description.set(true)" placeholder="What is this form for?" rows="3"></textarea>
    </mat-form-field>

    <div class="brand-row">
      <label class="brand-label">
        <mat-icon>palette</mat-icon>
        <span>Brand color</span>
      </label>
      <input type="color" class="brand-input" [value]="brandColor() || '#6366f1'" (input)="brandColor.set($any($event.target).value)" />
      <span class="brand-hex" [style.color]="brandColor() || 'var(--brand-text-subtle)'">{{ brandColor() || 'Default' }}</span>
      @if (brandColor()) {
        <button mat-button type="button" class="brand-reset" (click)="clearBrandColor()">
          <mat-icon>refresh</mat-icon>
          <span>Reset</span>
        </button>
      }
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
  <button mat-flat-button type="button" class="btn-primary" (click)="submit()" [disabled]="invalid || isSubmitting()">
    @if (isSubmitting()) { <span>Creating&hellip;</span> } @else { <span>Create form</span> }
  </button>
</mat-dialog-actions>
