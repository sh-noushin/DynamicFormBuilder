<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">FormBuilder</h1>
    <p class="login-subtitle">Sign in to your workspace</p>

    <div class="login-fields">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput type="text" [value]="username()" (input)="username.set($event.target.value)" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [value]="password()" (input)="password.set($event.target.value)" />
      </mat-form-field>
      <button class="primary-button" [disabled]="isLoading()" (click)="login()">
        @if (isLoading()) { <span>Logging in&hellip;</span> } @else { <span>Login</span> }
      </button>
      @if (error()) {
        <div class="error-message">{{ error() }}</div>
      }
      <p class="signup-hint">
        <a routerLink="/forgot-password">Forgot your password?</a>
      </p>
      <p class="signup-hint">
        Need an account? Ask your workspace admin for your sign-up link.
      </p>
    </div>
  </div>
</div>
