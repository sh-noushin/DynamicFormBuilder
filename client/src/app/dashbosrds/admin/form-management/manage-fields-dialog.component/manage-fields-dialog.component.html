<h2 mat-dialog-title class="dialog-title">
  <mat-icon>view_list</mat-icon>
  <span>Manage Fields</span>
  <span class="spacer"></span>
  <button mat-mini-fab color="primary" type="button" aria-label="Add Field" (click)="addField()">
    <mat-icon>add</mat-icon>
  </button>
</h2>

<mat-dialog-content class="dialog-content">
  <table mat-table [dataSource]="fields()" class="table-base">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef class="header-cell">Name</th>
      <td mat-cell *matCellDef="let f" class="cell">{{ f.name }}</td>
    </ng-container>
    <ng-container matColumnDef="label">
      <th mat-header-cell *matHeaderCellDef class="header-cell">Label</th>
      <td mat-cell *matCellDef="let f" class="cell">{{ f.label }}</td>
    </ng-container>
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef class="header-cell">Type</th>
      <td mat-cell *matCellDef="let f" class="cell">{{ f.type }}</td>
    </ng-container>
    <ng-container matColumnDef="isRequired">
      <th mat-header-cell *matHeaderCellDef class="header-cell">Required</th>
      <td mat-cell *matCellDef="let f" class="cell">{{ f.isRequired ? 'Yes' : 'No' }}</td>
    </ng-container>
    <ng-container matColumnDef="order">
      <th mat-header-cell *matHeaderCellDef class="header-cell">Order</th>
      <td mat-cell *matCellDef="let f" class="cell">{{ f.order }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="header-cell">Actions</th>
      <td mat-cell *matCellDef="let f" class="cell actions-cell">
        <button mat-icon-button class="btn-delete" matTooltip="Delete" (click)="deleteField(f)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-raised-button type="button" class="btn-cancel" (click)="close()">Cancel</button>
</mat-dialog-actions>
