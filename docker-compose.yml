# Two-service stack: the .NET API (SQLite-backed by default) and an nginx
# fronting the Angular SPA. Everything the API needs to persist lives in
# the ./data/api volume on the host so containers can be rebuilt without
# losing forms, submissions, or uploaded files.
#
# Quick start:
#   docker compose up --build -d
#   open http://localhost:8080
#
# The web container listens on host port 8080 and proxies /api/* to the
# api container on the internal network. The api port isn't exposed to
# the host in the default config - flip it on for local dev if you need
# to hit /api directly.

services:
  api:
    build:
      context: .
      dockerfile: server/FormBuilder.API/Dockerfile
    environment:
      # Override the sensitive settings via .env in CI/prod. The values
      # below are safe development defaults that DO NOT need editing to
      # get the stack running.
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/FormBuilder.db"
      FileUploads__StoragePath: "/app/data/uploads"
      # !!! Change this before shipping to prod. Any string of >=32 chars.
      Jwt__Key: "change-me-to-a-32-plus-char-secret-and-restart"
      Jwt__Issuer: "FormBuilderAPI"
      Jwt__Audience: "FormBuilderApp"
      Jwt__ExpireMinutes: "60"
      # Comma-separated origin list that CORS accepts. The nginx web
      # container is same-origin so this only needs entries when you
      # embed forms elsewhere.
      Cors__AllowedOrigins__0: "http://localhost:8080"
    volumes:
      - ./data/api:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# Uncomment to swap SQLite for Postgres. You'll also need to change the
